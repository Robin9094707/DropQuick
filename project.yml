name: DropQuick
options:
  bundleIdPrefix: eu.simplexsmp
  deploymentTarget:
    iOS: '26.0'
settings:
  base:
    SWIFT_VERSION: '5.0'
    TARGETED_DEVICE_FAMILY: '1,2'
    MARKETING_VERSION: '1.0.0'
    CURRENT_PROJECT_VERSION: '1'
    CODE_SIGN_STYLE: Automatic
    SWIFT_STRICT_CONCURRENCY: minimal
packages:
  SwiftProtobuf:
    url: https://github.com/apple/swift-protobuf.git
    exactVersion: 1.21.0
  SwiftECC:
    url: https://github.com/leif-ibsen/SwiftECC
    exactVersion: 3.5.3
  BigInt:
    url: https://github.com/leif-ibsen/BigInt
    exactVersion: 1.9.0
targets:
  DropQuick:
    type: application
    platform: iOS
    sources: [DropQuick, Shared]
    info:
      path: Config/App-Info.plist
      properties:
        CFBundleDisplayName: DropQuick
        UILaunchScreen: {}
        NSLocalNetworkUsageDescription: DropQuick findet Quick-Share-Geräte und überträgt Dateien direkt in deinem lokalen Netzwerk.
        NSBonjourServices: ['_FC9F5ED42C8A._tcp.']
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true
        UIFileSharingEnabled: true
        LSSupportsOpeningDocumentsInPlace: true
        CFBundleDocumentTypes:
          - CFBundleTypeName: Files
            LSHandlerRank: Alternate
            LSItemContentTypes: [public.data, public.content]
    entitlements:
      path: Config/App.entitlements
      properties:
        com.apple.security.application-groups: [group.eu.simplexsmp.dropquick]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: eu.simplexsmp.dropquick
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
    dependencies:
      - package: SwiftProtobuf
      - package: SwiftECC
      - package: BigInt
      - target: DropQuickShare
        embed: true
  DropQuickShare:
    type: app-extension
    platform: iOS
    sources: [ShareExtension, Shared]
    info:
      path: Config/Share-Info.plist
      properties:
        CFBundleDisplayName: DropQuick
        NSExtension:
          NSExtensionPointIdentifier: com.apple.share-services
          NSExtensionPrincipalClass: $(PRODUCT_MODULE_NAME).ShareViewController
          NSExtensionAttributes:
            NSExtensionActivationRule:
              NSExtensionActivationSupportsFileWithMaxCount: 50
              NSExtensionActivationSupportsImageWithMaxCount: 50
              NSExtensionActivationSupportsMovieWithMaxCount: 10
              NSExtensionActivationSupportsText: true
              NSExtensionActivationSupportsWebURLWithMaxCount: 1
    entitlements:
      path: Config/Share.entitlements
      properties:
        com.apple.security.application-groups: [group.eu.simplexsmp.dropquick]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: eu.simplexsmp.dropquick.share
        APPLICATION_EXTENSION_API_ONLY: true
        SKIP_INSTALL: true
  DropQuickTests:
    type: bundle.unit-test
    platform: iOS
    sources: [Tests]
    dependencies:
      - target: DropQuick
schemes:
  DropQuick:
    build:
      targets:
        DropQuick: all
    test:
      targets: [DropQuickTests]
